# सुदर्शन / SUDARSHAN: who may reach the AI assistant's addresses (M19.3, M17.9).
#
# Installed by the owner, once, as /etc/nginx/snippets/sudarshan-mcp.conf and included with one
# line inside SUDARSHAN's own server { } block and nowhere else (sudarshan/README.md, "nginx lines
# for the AI assistant"). Needs sudarshan-mcp-zone.conf in /etc/nginx/conf.d. After any change:
# `nginx -t`, then reload nginx; never restart it.
#
# The assistant is the owner's AI app, and its calls come from Anthropic's cloud. So the addresses
# an AI app calls are open to Anthropic's published range and to nobody else, the one page the
# owner's own browser opens (the consent page) stays open, and the health line is for this
# machine only. These lines are a second lock: with them missing, a caller still needs a valid
# pass, and the assistant still has no tool that places, changes or cancels an order.
#
# 160.79.104.0/21 is the range Anthropic publishes for calls to MCP servers (checked 14 Nov 2026).
# Read Anthropic's page again before installing, and whenever a connection that worked stops.

# The assistant's calls and its keepalive stream.
location ^~ /mcp {
    allow 160.79.104.0/21;
    deny all;
    limit_req zone=sudarshan_mcp burst=20 nodelay;
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

# "Is the assistant's door there": for this machine only.
location = /mcp/healthz {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Registering an AI app, exchanging and revoking its passes, and the signing key's public half.
location ^~ /oauth/ {
    allow 160.79.104.0/21;
    deny all;
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The consent page: opened by the owner's own browser, and useless without his SUDARSHAN login.
location = /oauth/authorize {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Where an AI app learns how to sign in.
location ^~ /.well-known/oauth- {
    allow 160.79.104.0/21;
    deny all;
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
