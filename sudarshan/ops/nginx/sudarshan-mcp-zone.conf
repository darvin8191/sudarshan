# सुदर्शन / SUDARSHAN: the AI assistant's request limit (M19.3). One line for nginx's http level.
#
# Installed by the owner, once, as /etc/nginx/conf.d/sudarshan-mcp-zone.conf (sudarshan/README.md,
# "nginx lines for the AI assistant"). It only names a counter; sudarshan-mcp.conf uses it. It
# changes nothing for any other site that nginx serves.

limit_req_zone $binary_remote_addr zone=sudarshan_mcp:1m rate=2r/s;
