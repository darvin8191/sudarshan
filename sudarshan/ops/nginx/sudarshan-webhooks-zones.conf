# सुदर्शन / SUDARSHAN (M12.2): the fence around the alert links, http part.
# Installed once by the owner as /etc/nginx/conf.d/sudarshan-webhooks-zones.conf, beside
# snippets/sudarshan-webhooks.conf (sudarshan/README.md, "The fence around the alert links").
# The deploy tool never edits nginx; it only says, after an install, when these lines are missing.
# Every name here starts with sud_, so none can meet a name of the server's own configuration.

# TradingView sends every alert from these four addresses (its page "About webhooks"). This is a
# filter, not an identity: every TradingView customer's alerts leave from the same four, so the
# token in the link stays the credential. It removes the rest of the internet and nothing more.
# TradingView sends over IPv4 only, so no IPv6 address is listed.
geo $sud_tv_sender {
    default 0;
    52.89.214.238 1;
    34.212.75.30 1;
    54.218.53.128 1;
    52.32.178.7 1;
}
# Alerts from one address: 2 a second, a burst of 10 let through at once, the rest answered 429.
limit_req_zone $binary_remote_addr zone=sud_hooks:1m rate=2r/s;
