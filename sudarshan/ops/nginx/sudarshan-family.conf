# सुदर्शन / SUDARSHAN family view (P6 O3; M2.7, M2.11, M2.16): the family view's nginx lines, server
# part. Installed once by the owner as /etc/nginx/snippets/sudarshan-family.conf and taken in by ONE
# line in the server block that serves port 443, after that block's own set and if lines and before
# its first location (sudarshan/family/README.md, "Installing the nginx lines"):
#     include snippets/sudarshan-family.conf;
# It needs conf.d/sudarshan-family-zones.conf and snippets/sudarshan-family-proxy.conf.

# The viewer guard. A family phone (conf.d/sudarshan-family-zones.conf) asking for anything of
# OpenAlgo outside the family view gets the refusal page before any location is chosen, so this one
# line covers every location of the server: /, /api, /auth, /sudarshan, /socket.io and /ws alike.
# OpenAlgo refuses such a phone anyway, since it never holds an OpenAlgo session; this is the second lock.
if ($sud_block) {
    rewrite ^ /sudarshan-family-blocked? last;
}

# The refusal page: a page in the light look, never a download (cross-design Y33), never kept.
location = /sudarshan-family-blocked {
    internal;
    default_type "text/html; charset=utf-8";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    return 403 '<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>सुदर्शन · SUDARSHAN</title>
<style>
html{color-scheme:only light;background:#F4F6F8}
body{margin:0;padding:24px 16px;font:17px/1.5 system-ui,"Noto Sans","Noto Sans Devanagari",sans-serif;color:#0F1A24}
main{max-width:28rem;margin:8vh auto 0;padding:24px;background:#FFFFFF;border:1px solid #E3E7EC;border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.lockup{margin:0 0 16px;color:#0E5A73;font-weight:700;letter-spacing:.04em}
h1{margin:0 0 8px;font-size:22px;line-height:1.3}
p{margin:0 0 16px}
a.go{display:block;min-height:48px;line-height:48px;border-radius:12px;background:#0E5A73;color:#FFFFFF;text-align:center;font-weight:600;text-decoration:none}
.owner{margin:16px 0 0;color:#475569;font-size:15px}
</style>
</head>
<body>
<main>
<p class="lockup">सुदर्शन · SUDARSHAN</p>
<h1>This part of सुदर्शन / SUDARSHAN is for the account owner</h1>
<p>This phone is signed in to the family view. The family view shows the books and cannot place, change or cancel an order.</p>
<a class="go" href="/family/">Open the family view</a>
<p class="owner">Account owner: if you signed in to the family view on this phone to try it, open it, go to Settings and tap Sign out next to this phone, then open सुदर्शन again.</p>
</main>
</body>
</html>
';
}

# The family service, sudarshan-family on 127.0.0.1:5585. Each location names its own path after the
# address, so nginx hands on the path it matched, cleaned of ../ and %2e, and never the path as the
# phone wrote it: nothing but /family/api/... and /family/ws ever reaches the service, and its sealed
# doors (/v1/...) and /health cannot be reached from outside.

# Signing in and joining (cross-design review H2): 5 a minute per address, 12 a minute in all.
location = /family/api/login {
    limit_req zone=sud_family_signin burst=3 nodelay;
    limit_req zone=sud_family_signin_all burst=5 nodelay;
    include snippets/sudarshan-family-proxy.conf;
    proxy_pass http://127.0.0.1:5585/family/api/login;
}
location = /family/api/join {
    limit_req zone=sud_family_signin burst=3 nodelay;
    limit_req zone=sud_family_signin_all burst=5 nodelay;
    include snippets/sudarshan-family-proxy.conf;
    proxy_pass http://127.0.0.1:5585/family/api/join;
}
# An invite's details: the invite code is in the path, so this path is kept out of the access log,
# and a refusal by the limit out of the error log as well (review L8).
location ^~ /family/api/join/ {
    access_log off;
    limit_req zone=sud_family_signin burst=3 nodelay;
    limit_req_log_level warn;
    include snippets/sudarshan-family-proxy.conf;
    proxy_pass http://127.0.0.1:5585/family/api/join/;
}
location ^~ /family/api/ {
    limit_req zone=sud_family_api burst=40 nodelay;
    include snippets/sudarshan-family-proxy.conf;
    proxy_pass http://127.0.0.1:5585/family/api/;
}
# The phones' WebSocket. The service pings every 25 seconds, so a socket quiet for two minutes is dead.
location = /family/ws {
    limit_req zone=sud_family_api burst=40 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sud_family_connection;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:5585/family/ws;
}

# The invite page, /family/join/<code>: OpenAlgo serves the family shell there, at 127.0.0.1:5000 as
# for every other page. The code is in the path, so the page is kept out of the access log (review
# L8), and it is answered with no-referrer, so that no request the page makes afterwards carries the
# code in its Referer either. OpenAlgo reads CF-Connecting-IP, True-Client-IP and X-Client-IP before
# X-Real-IP when TRUST_PROXY_HEADERS is on, so none of them is ever passed on from the phone.
location ^~ /family/join/ {
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;
    proxy_pass http://127.0.0.1:5000/family/join/;
}

# nginx's own refusals on the family API, as the family service would answer them. They are not
# written to the access log: one may be for an invite's path. A refusal by a limit is in nginx's
# error log, with the address it came from.
location @sud_family_too_many {
    access_log off;
    default_type "application/json; charset=utf-8";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 429 '{"status":"error","code":"busy","message":"Too many tries from this connection. Wait a minute, then try again."}';
}
location @sud_family_too_large {
    access_log off;
    default_type "application/json; charset=utf-8";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 413 '{"status":"error","code":"too_large","message":"That is too large to send."}';
}
location @sud_family_unavailable {
    access_log off;
    default_type "application/json; charset=utf-8";
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 503 '{"status":"error","code":"unavailable","message":"The family view did not answer. Wait a minute, then try again."}';
}
