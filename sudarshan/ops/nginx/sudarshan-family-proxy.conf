# सुदर्शन / SUDARSHAN family view (P6 O3): what every location of the family API shares. Installed once
# by the owner as /etc/nginx/snippets/sudarshan-family-proxy.conf; included by
# snippets/sudarshan-family.conf, never by the site itself.

proxy_http_version 1.1;
# The phone's own address, set by nginx and never taken from what the phone sent: the family service
# reads X-Real-IP for a device's place, and refuses its sealed doors and /health whenever one of these
# three is present, so a request nginx forwards can never reach them.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_redirect off;
# The service's own cap on a viewer's request body (64 KiB), held here before it is read.
client_max_body_size 64k;
client_body_buffer_size 64k;
# nginx's own refusals, in the family view's envelope and words, so the phone can show them.
limit_req_status 429;
error_page 413 @sud_family_too_large;
error_page 429 @sud_family_too_many;
error_page 502 504 =503 @sud_family_unavailable;
