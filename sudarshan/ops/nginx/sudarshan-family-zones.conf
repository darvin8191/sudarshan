# सुदर्शन / SUDARSHAN family view (P6 O3; M2.11, M2.16): the family view's nginx lines, http part.
# Installed once by the owner as /etc/nginx/conf.d/sudarshan-family-zones.conf, beside
# snippets/sudarshan-family.conf and snippets/sudarshan-family-proxy.conf (sudarshan/family/README.md,
# "Installing the nginx lines"). The deploy tool never edits nginx; `sudarshan-deploy --nginx-check`
# says whether these files are in place, loaded and this release's. Every name here starts with sud_,
# so none can meet a name of the server's own configuration.

# A family phone carries the family view's session cookie and not OpenAlgo's session cookie. A phone
# with both is the owner's (he may try the family view on his own phone) and is left alone; a phone
# with neither is a stranger and meets OpenAlgo as before.
map $http_cookie $sud_family {
    default 0;
    "~(^|;\s*)__Host-sudarshan_family=" 1;
}
# OpenAlgo's session cookie: __Secure- and SESSION_COOKIE_NAME from OpenAlgo's .env (session unless
# it was changed). The one line here the owner may have to edit; the nginx check compares it with .env.
map $http_cookie $sud_owner {
    default 0;
    "~(^|;\s*)__Secure-session=" 1;
}
map "$sud_family:$sud_owner" $sud_viewer {
    default 0;
    "1:0" 1;
}
# What a family phone may reach: the family view under /family (its pages, its API, its WebSocket)
# and the files those pages load. Everything else is OpenAlgo's and gets the refusal page
# (snippets/sudarshan-family.conf). The patterns are tried in order; $uri is the path nginx has
# already cleaned of ../ and %2e.
map "$sud_viewer:$uri" $sud_block {
    default 0;
    "~^1:/family(/|$)" 0;
    "~^1:/assets/" 0;
    "~^1:/images/" 0;
    "~^1:/(favicon\.ico|apple-touch-icon\.png|sw\.js|offline\.html)$" 0;
    "~^1:" 1;
}
# The family WebSocket's Connection header: upgrade for a handshake, close for anything else.
map $http_upgrade $sud_family_connection {
    default upgrade;
    "" close;
}
# Who a limit counts: the address, or for IPv6 its first 64 bits (a phone network hands a phone a
# whole /64, so counting each IPv6 address alone would count nothing).
map $remote_addr $sud_family_client {
    default $binary_remote_addr;
    "~^(?<sud_net6>[0-9a-f]{1,4}(:[0-9a-f]{1,4}){3}):" $sud_net6;
    "~^(?<sud_net6z>[0-9a-f:]*)::" $sud_net6z;
}
# Signing in and joining cost the family service a deliberately slow password check each, so they
# are held to 5 a minute per address and to 12 a minute from everyone together: past that, nginx
# answers in plain words and the service does no work. The rest of the family API: 20 a second.
limit_req_zone $sud_family_client zone=sud_family_signin:1m rate=5r/m;
limit_req_zone sudarshan-family zone=sud_family_signin_all:1m rate=12r/m;
limit_req_zone $sud_family_client zone=sud_family_api:2m rate=20r/s;
