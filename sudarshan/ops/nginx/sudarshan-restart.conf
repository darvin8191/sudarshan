# सुदर्शन / SUDARSHAN: the page shown while the app restarts (M1.17).
#
# Installed by the owner, once, as /etc/nginx/snippets/sudarshan-restart.conf and included with one
# line inside SUDARSHAN's own server { } block and nowhere else (sudarshan/README.md, "The restart
# page"). It needs the page itself copied to /usr/share/sudarshan/restarting.html, owned by root.
# After any change: `nginx -t`, then reload nginx; never restart it.
#
# During a deploy the app is down for some seconds, and nginx answers for it: "502 Bad Gateway"
# when nothing listens, "504 Gateway Time-out" when it did not answer in time. With these lines
# those two answers keep their status and carry SUDARSHAN's own page, which says the app is
# restarting and tries the same address again by itself. Nothing else changes: an answer the app
# itself gives is passed on as it is, and the family view's own lines for its API stay in charge
# there (a location's own error_page wins over this one).
#
# The page is read under /images/ on purpose. With the family view's lines installed, a family
# phone may ask this site only for the family view and the files under /assets/ and /images/, and
# that check runs again on the way to this page: under any other name a family phone would get
# the "for the account owner" page while the app restarts. The name is nginx's alone (internal):
# asked for from outside it answers "not found", and the app's own copy of the page, which the
# family app keeps on the phone, is at /images/restarting.html as before.

error_page 502 504 /images/sudarshan-restarting;

location = /images/sudarshan-restarting {
    internal;
    types { }
    default_type "text/html; charset=utf-8";
    alias /usr/share/sudarshan/restarting.html;
}
