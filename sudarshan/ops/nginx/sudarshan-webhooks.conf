# सुदर्शन / SUDARSHAN (M12.2): the fence around the alert links, server part.
# Installed once by the owner as /etc/nginx/snippets/sudarshan-webhooks.conf and taken in by ONE
# line in the server block that serves port 443 (sudarshan/README.md, "The fence around the alert
# links"):
#     include snippets/sudarshan-webhooks.conf;
# It needs conf.d/sudarshan-webhooks-zones.conf. Each location below is a prefix match marked ^~,
# so it is chosen before any regular-expression location of the site.
#
# What every line is for:
#   if ... return 404      an address that is not TradingView's gets nginx's own "not found", and
#                          the app never sees the request.
#   limit_req              2 a second per address, 10 at once; more is answered 429.
#   client_max_body_size   a larger alert is refused from its header, before the body is read.
#   access_log off         the token is in the path; nginx must not keep it.
#   error_log /dev/null    nginx writes the request line, token and all, beside every refusal and
#                          every upstream error. Those lines are dropped for these paths only; the
#                          app keeps its own record of each alert, without the token.
#   proxy_ignore_client_abort on
#                          TradingView hangs up after 3 seconds; an order to Upstox can take longer.
#                          The request is finished whether or not the sender still listens.
#   proxy_read_timeout     one call to Upstox may take 120 s.
#   the header lines       the app is told the sender's address by nginx and by nobody else:
#                          X-Real-IP and X-Forwarded-For are set to the address nginx saw, and the
#                          three headers the app would believe before them (with
#                          TRUST_PROXY_HEADERS on, utils/ip_helper.py) are cleared, so a sender
#                          cannot name itself. A location that sets one header no longer inherits
#                          the server's, so Host and the scheme are set here too.
#   proxy_pass             OpenAlgo's own listener on this server.

# The Automation alert links (SUDARSHAN's own intake). An alert message is about 450 bytes.
location ^~ /sudarshan/tv/ {
    if ($sud_tv_sender = 0) { return 404; }
    limit_req zone=sud_hooks burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    access_log off;
    error_log /dev/null crit;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_pass http://127.0.0.1:5000;
}

# OpenAlgo's strategy-module and Flow webhooks: open to the whole internet until this file is
# installed. Fenced to TradingView's addresses in the same way; the app's own size checks stay.
location ^~ /strategy/webhook/ {
    if ($sud_tv_sender = 0) { return 404; }
    limit_req zone=sud_hooks burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    access_log off;
    error_log /dev/null crit;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_pass http://127.0.0.1:5000;
}

location ^~ /flow/webhook/ {
    if ($sud_tv_sender = 0) { return 404; }
    limit_req zone=sud_hooks burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    access_log off;
    error_log /dev/null crit;
    proxy_ignore_client_abort on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Client-IP "";
    proxy_pass http://127.0.0.1:5000;
}

# Chartink is not used on this server, so its webhook is refused for every sender. To use it,
# replace this block with a copy of the one above whose first line tests a list of Chartink's own
# sender addresses (a second geo block in conf.d/sudarshan-webhooks-zones.conf), not TradingView's.
location ^~ /chartink/webhook/ {
    access_log off;
    error_log /dev/null crit;
    return 404;
}
