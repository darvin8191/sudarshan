# सुदर्शन / SUDARSHAN: settings a release needs in OpenAlgo's .env.
#
# sudarshan-deploy applies this list on every deploy, after the release is checked out and before
# OpenAlgo starts again, so the owner never edits the server's .env by hand. As root, it reads the
# list from GitHub at the release tag, never from the server's copy of the code.
# `sudarshan-deploy --check` shows what the latest release would change.
#
# Format: one setting per line, fields separated by spaces.
#
#     KEY  VALUE  [OLD_VALUE ...]
#
#   KEY        the .env key: letters, digits and _, not starting with a digit.
#   VALUE      the value this release needs. It is written single-quoted, as .sample.env writes
#              it: KEY='VALUE'.
#   OLD_VALUE  any number of values it may replace. List the defaults that OpenAlgo or an earlier
#              SUDARSHAN release shipped, never a value an owner might choose.
#
# On each deploy:
#   - KEY missing from .env: KEY='VALUE' is added at the end;
#   - KEY already holds VALUE: nothing happens;
#   - KEY holds one of the OLD_VALUEs: only the value is replaced; its spacing, a leading
#     `export` and a trailing comment stay;
#   - KEY holds anything else: it is left alone, because the owner chose it;
#   - KEY set more than once, or written in a form the tool does not rewrite: left alone.
#   Every other line of .env stays byte for byte, with its owner, group and mode. The previous
#   .env is kept in that deploy's backup folder (mode 600) and put back if the deploy rolls back.
#
# Values are plain words: letters, digits and . _ : / @ + , - only (no spaces, quotes, # or $).
# Write '' for an empty value. Blank lines and anything after a # are ignored.

# Keep the Upstox market-data connection open through a phone's screen-off (seconds).
# OpenAlgo's default 0 closes it as soon as the last screen does.
WEBSOCKET_BROKER_LINGER_SECONDS  300  0

# One Upstox market-data connection (1,000 symbols) for OpenAlgo's proxy, until it is verified
# whether Upstox's portfolio stream counts against the 5-connection limit. Upstream ships 3; an
# owner-chosen 2 stays.
MAX_WEBSOCKET_CONNECTIONS  1  3

# The risk guard (Settings > Risk, the kill switch): "sandbox" checks Analyze mode's sandbox
# orders only, while the owner tries it there first; a later release moves it to "on" for Live
# too. No old value: no release shipped one, so a value already in .env is the owner's and stays.
SUDARSHAN_RISK_GUARD  sandbox

# Order calls to Upstox per second, at most (broker/upstox/api/rate_limiter.py; OpenAlgo's own
# figure is 8 and Upstox allows 10, the most SEBI allows without registration): 5 leaves room for
# a burst arriving unevenly (M5.14). An Exit all of 10 positions then takes about 2 s. No old
# value: a value already in .env is the owner's and stays.
UPSTOX_ORDER_MAX_PER_SECOND  5

# The portfolio (the Portfolio page: the Upstox tab and the owner's own tabs). The service
# sudarshan-portfolio answers every request as switched off until this is on. No old value: a value
# already in .env is the owner's, so an owner who sets it to off keeps it off through later deploys.
SUDARSHAN_PORTFOLIO  on

# Watchlists v2 (the sections, follow rows and the rest of lane W: sudarshan/watchlists/README.md).
# Ships off: while off, the bridge answers that it is switched off and opens nothing, and the
# watchlist page is v0.6.0's; a list deleted or cleared in OpenAlgo still clears its overlay (one
# small write to the watchlists file). No old value: a value already in .env is the owner's and
# stays.
SUDARSHAN_WATCHLISTS_V2  off

# The trade journal and its reports (the Journal and Reports pages: sudarshan/journal/README.md).
# Off in code: the service sudarshan-journal answers every request as switched off until this is
# on, and the alerts' report desk delivers reports only while the journal says it is on. It places
# no order. No old value: a value already in .env is the owner's, so an owner who sets it to off
# keeps it off through later deploys.
SUDARSHAN_JOURNAL  on

# The tax working paper and Upstox's actual charges (the Portfolio page's Tax view and its inputs,
# the working paper in the journal's Tax pack, the charges read by day and month and their
# comparison with the estimate: sudarshan/portfolio/README.md, sudarshan/journal/README.md). Off in
# code: sudarshan-portfolio and sudarshan-journal answer each of these as switched off until this
# is on. It places no order. No old value: a value already in .env is the owner's, so an owner who
# sets it to off keeps it off through later deploys. The two later switches of the same phase,
# SUDARSHAN_PORTFOLIO_INSIGHTS (corporate actions, dividends, risk) and SUDARSHAN_PORTFOLIO_GOALS
# (goals, the exports), are not listed here: they stay off in code until a later release adds them.
SUDARSHAN_TAX  on

# The AI assistant (OpenAlgo's remote MCP) can never be switched on with order tools (M17.9).
# Remote MCP itself stays off until the owner turns it on; these three only make sure that, when
# he does, no tool that places, changes or cancels an order exists, the right to trade is never
# offered, and an AI app that registers itself waits for his approval. The last word of the second
# and third lines is OpenAlgo's own default, which the deploy replaces. If .env ends up holding
# anything else, the app starts without the assistant and its log says why.
OPENALGO_MCP_READ_ONLY  1
MCP_OAUTH_WRITE_SCOPE_ENABLED  False  True
MCP_OAUTH_REQUIRE_APPROVAL  True  False
