# सुदर्शन / SUDARSHAN: NSE calendar lines a release ships into /etc/sudarshan.
#
# Two day files there say which days are trading days: nse_holidays.txt (days NSE is closed) and
# nse_extra_trading_days.txt (a session on a day that is otherwise closed, such as Muhurat
# trading). The deploy tool's market gate, auto-login and the order alerts read them (the feed
# reads the holiday file), and each reads a changed file again by itself, so nothing restarts.
#
# sudarshan-deploy merges this list into those files, so the owner never edits them by hand. As
# root, it reads the list from GitHub at a release tag, never from the server's copy of the code:
# every run applies the list of the installed release, at any hour and whether or not it installs
# anything, and an install applies the list of the release it installs.
# `sudarshan-deploy --check` shows what the latest release would change.
#
# Format: a [FILE] line names a day file, and the lines below it say what goes in that file:
#
#     [nse_extra_trading_days.txt]
#     line 2026-11-08 18:00-19:15  # Muhurat trading
#     was  2026-11-08  # Muhurat trading; timings to follow
#
#   [FILE]  nse_holidays.txt or nse_extra_trading_days.txt.
#   line    the line this release wants in the file, written exactly as it follows the word:
#           YYYY-MM-DD, then (extra trading days only) that day's own HH:MM-HH:MM window in
#           IST, then an optional # comment. Plain ASCII. One `line` per date and file.
#   was     an earlier version of the `line` above that a release shipped, which it may
#           replace. List only lines a release shipped, never one the owner wrote.
#
# On each run, for each `line`:
#   - the file has it already: nothing happens;
#   - the file has no line for its date: it is added at the end;
#   - the file has one of its `was` lines and no other line for that date: that line is
#     replaced where it stands;
#   - the file has the date in a line no release shipped: it is left alone, because the
#     owner wrote it, and the log says so (also when the date is there more than once).
#   No line is ever deleted. Comments, order and every other byte stay, and so do the file's
#   owner, group and mode; a missing file is created root:sudarshan 640, like the other files
#   in /etc/sudarshan. The new file is written next to the old one and renamed over it, so a
#   reader never sees half a file. An install keeps the files it changes in its backup folder
#   and puts them back if it rolls back. A list or a write that fails is logged, and never
#   stops an install or a rollback.
#
# Blank lines and lines starting with # are ignored.

[nse_holidays.txt]

[nse_extra_trading_days.txt]
# Muhurat trading 2026 is on Sunday 8 November (NSE circular 212/2025, 12 Dec 2025); NSE gives
# the timings later. Until a release adds the window, the day counts as a trading day with the
# usual hours, and the order alerts follow those hours, not the session. When NSE announces them,
# the window runs from the pre-open to the close:
#     line 2026-11-08 HH:MM-HH:MM  # Muhurat trading (NSE circular 212/2025)
#     was  2026-11-08  # Muhurat trading (NSE circular 212/2025); timings to follow
line 2026-11-08  # Muhurat trading (NSE circular 212/2025); timings to follow
