# सुदर्शन / SUDARSHAN: NSE calendar lines a release ships into /etc/sudarshan.
#
# Two day files there say which days are trading days: nse_holidays.txt (days NSE is closed) and
# nse_extra_trading_days.txt (a session on a day that is otherwise closed, such as Muhurat
# trading). The deploy tool's market gate, auto-login and the order alerts read them (the feed
# reads the holiday file), and each reads a changed file again by itself, so nothing restarts.
#
# sudarshan-deploy merges this list into those files, so the owner never edits them by hand. As
# root, it reads the list from GitHub at a release tag, never from the server's copy of the code,
# and takes it only when it arrived whole: every run applies the list of the installed release
# (kept once it arrived whole; one GitHub did not find is asked for again on the next run), and
# an install applies the list of the release it installs.
# `sudarshan-deploy --check` shows what the latest release would change.
#
# Format: a [FILE] line names a day file, and the lines below it say what goes in that file:
#
#     [nse_extra_trading_days.txt]
#     line 2026-11-08 14:05-15:40  # Muhurat trading
#     was  2026-11-08  # Muhurat trading, as shipped before its timings were known
#     drop 2026-11-07  # Muhurat trading, as shipped for the wrong day
#
#   [FILE]  nse_holidays.txt or nse_extra_trading_days.txt.
#   line    the line this release wants in the file, written exactly as it follows the word:
#           YYYY-MM-DD, then (extra trading days only) that day's own HH:MM-HH:MM window in
#           IST, then an optional # comment. Plain ASCII. One `line` per date and file.
#   was     an earlier version of the `line` above, for the same date, that a release shipped;
#           it may be replaced. List only lines a release shipped, never one the owner wrote.
#   drop    a line an earlier release shipped and this one takes back (a wrong date, say).
#
# On each run, for each `line`:
#   - the file has it already: nothing happens;
#   - the file has no line for its date: it is added at the end, unless this tool added the
#     line (or a version of it) before and the owner took it out: then it stays out;
#   - the file has one of its `was` lines and no other line for that date: that line is
#     replaced where it stands;
#   - the file has the date in a line no release shipped: it is left alone, because the
#     owner wrote it (also when the date is there more than once).
# A `drop` takes out a line only when this tool added it; a line the owner wrote stays.
# Today's trading day is never changed in a way that could open the market gate:
#   - a holiday is added only before its day, never on it;
#   - a run that installs nothing changes no line dated today or earlier, except that it adds
#     a special session for today; such changes wait for an install, outside market hours;
#   - the gate of a run reads the day files as the run found them and as they are after its
#     calendar step, and holds the release if either says trading;
#   - before it stops OpenAlgo, an install also asks the gate of the day files as its own list
#     would leave them, so a release that announces today's session, or takes back today's
#     holiday, waits.
# Comments, order and every other byte stay, and so do the file's owner, group and mode; a
# missing file is created root:sudarshan 640, like the other files in /etc/sudarshan, which
# must be root's and closed to others. The new file is written next to the old one and renamed
# over it, so a reader never sees half a file. An install keeps the files it changes in its
# backup folder and puts them back if it rolls back. Each note (a line left alone, a list that
# could not be fetched) is logged once while it holds; a change is logged once it is written.
# A list or a write that fails never stops an install or a rollback.
#
# Blank lines and lines starting with # are ignored.

[nse_holidays.txt]

[nse_extra_trading_days.txt]
# Muhurat trading 2026: Sunday 8 November, an afternoon session, set by two NSE circulars of
# 19 Oct 2026 that follow the 2026 holiday list (circular 212/2025). Cash, circular 149/2026
# (NSE/CMTR/76941): pre-open 14:05-14:20, continuous trading 14:20-15:30, closing auction to
# 15:35. Equity derivatives, circular 142/2026 (NSE/FAOP/76940): continuous trading 14:20-15:40.
# The window runs from the pre-open to the F&O close: the order alerts are connected then,
# auto-login logs in that morning as on any trading day, and the deploy tool installs nothing all
# day. A release with this line must be installed before that Sunday.
line 2026-11-08 14:05-15:40  # Muhurat, NSE circulars 149/2026 (cash) and 142/2026 (F&O to 15:40)
