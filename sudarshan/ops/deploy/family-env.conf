# सुदर्शन / SUDARSHAN: settings a release needs in the family view's own file,
# /etc/sudarshan-family/family.env (root:sudarshan-family 640), read by sudarshan-family at start
# (sudarshan/family/config.py). Same format and rules as openalgo-env.conf: a missing key is
# added, a key still at a default an earlier release shipped is moved, a value the owner chose
# stays. sudarshan-deploy makes the file, empty, when it is absent, and only once the owner's
# one-time family set-up has made /etc/sudarshan-family (before that nothing is written anywhere).
#
#     KEY  VALUE  [OLD_VALUE ...]

# The family view ships switched OFF: the service answers every family request as off, opens no
# store and runs no job until the owner's own SUDARSHAN_FAMILY=on in this file (the switch-on
# steps are in sudarshan/family/README.md). No old value: a value already here is the owner's and
# stays, so an owner who turned it on keeps it on through later deploys.
SUDARSHAN_FAMILY  off
