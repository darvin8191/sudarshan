# सुदर्शन / SUDARSHAN: settings a release needs in the screener service's own file,
# /etc/sudarshan/screener.env (root:sudarshan 640), read by sudarshan-screener at start
# (sudarshan/screener/config.py). Same format and rules as openalgo-env.conf: a missing key is
# added, a key still at a default an earlier release shipped is moved, a value the owner chose
# stays. sudarshan-deploy makes the file, empty, when it is absent.
#
#     KEY  VALUE  [OLD_VALUE ...]

# The screener ships switched OFF (S8): it answers every request as off, opens no database and
# claims nothing at the feed until the owner's live session (design 7.4) and then his own
# SUDARSHAN_SCREENER=on in this file. No old value: a value already here is the owner's and stays,
# so an owner who turned it on keeps it on through later deploys.
SUDARSHAN_SCREENER  off

# Its one listener (cross-design X2, S10). No old value.
SUDARSHAN_SCREENER_HTTP_PORT  5584
