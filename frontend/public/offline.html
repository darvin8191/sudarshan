<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>सुदर्शन · SUDARSHAN · Offline</title>
    <style>
      :root {
        color-scheme: only light;
        --bg-canvas: #f4f6f8;
        --surface-card: #ffffff;
        --text-primary: #0f1a24;
        --text-secondary: #475569;
        --brand: #0e5a73;
        --border: #e3e7ec;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg-canvas);
        color: var(--text-primary);
        font-family: Barlow, system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Devanagari', 'Noto Sans Gujarati', sans-serif;
      }
      main {
        width: 100%;
        max-width: 26rem;
        padding: 28px 20px;
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
        text-align: center;
      }
      .lockup {
        margin: 0 0 18px;
        color: var(--brand);
        font-weight: 600;
        letter-spacing: 0.4em;
        font-size: 0.9rem;
      }
      .lockup span {
        display: block;
        margin-bottom: 4px;
        font-size: 1.6rem;
        letter-spacing: 0;
        font-weight: 400;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        font-weight: 700;
      }
      p {
        margin: 0 0 22px;
        color: var(--text-secondary);
        font-size: 1rem;
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        min-width: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 14px;
        background: var(--brand);
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #3949ab;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="lockup"><span>सुदर्शन</span>SUDARSHAN</p>
      <h1>No connection</h1>
      <p>
        You are offline. Prices need a connection, so nothing here is shown as current. The app
        reopens by itself when the connection returns.
      </p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script src="/images/family-offline.js"></script>
  </body>
</html>
