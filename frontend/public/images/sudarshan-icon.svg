<!-- सुदर्शन app icon: सु in Tiro Devanagari Sanskrit 400 (SIL OFL 1.1, The Indigo Project Authors) shaped with HarfBuzz and drawn as paths, so it needs no font. Colours "Mor" (peacock): tile #0E5A73, gold ring #E3A21A, white glyph. Glyph and ring stay inside the maskable safe zone (radius 40%), so the full-bleed tile is also the maskable icon. frontend/scripts/render-sudarshan-icons.mjs renders the PNG and ICO files from it; the root classes "full-bleed" (square tile, for iOS) and "small" (no ring, larger and bolder glyph, for 16 and 32 px) select its variants. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="सुदर्शन">
  <style>
    .full-bleed #tile { rx: 0; }
    .small #ring { display: none; }
    .small #glyph { transform: translate(248px, 261px) scale(1.75) translate(-256px, -256px); }
    .small #glyph path { stroke: #FFFFFF; stroke-width: 20px; stroke-linejoin: round; }
  </style>
  <rect id="tile" width="512" height="512" rx="112" fill="#0E5A73"/>
  <circle id="ring" cx="256" cy="256" r="194" fill="none" stroke="#E3A21A" stroke-width="12"/>
