# सुदर्शन / SUDARSHAN checks for the `sudarshan` branch.
# Upstream's ci.yml runs only for `main` (which this fork never pushes to), so the two never overlap.
# Only our own code is gated here: upstream's test suite is upstream's business.
name: SUDARSHAN CI

on:
  pull_request:
    branches: ["sudarshan"]
  push:
    branches: ["sudarshan"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sudarshan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run

  # The service tests in four shards side by side (sudarshan/tests/ci_shards.py splits them by file):
  # one job had grown past 20 minutes once watchlists v2 was in.
  backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      # The production server packages, which pyproject does not install: without them the
      # eventlet and gunicorn tests in sudarshan/ skip instead of running. Same pins as the
      # upstream gthread-migration job; `uv run` below keeps them (its sync is not exact).
      - name: Production server packages (gunicorn, eventlet)
        run: uv pip install "gunicorn>=25.0,<26" "eventlet==0.41.2"
      - name: Ruff (sudarshan/ only)
        run: |
          if find sudarshan -name '*.py' 2>/dev/null | grep -q .; then
            uv run ruff check sudarshan
          else
            echo "no Python code in sudarshan/ yet"
          fi
      - name: Tests (sudarshan/ only, one shard of four)
        run: |
          files=$(uv run python -m sudarshan.tests.ci_shards ${{ matrix.shard }} 4)
          # v0.12.0 review L3: the family view's nginx files are also run in a real nginx, and
          # without a binary those tests skip. The shard that holds them installs one (the
          # package's own service is stopped: the tests start their own on ports of their own).
          case " $files " in
            *test_nginx_text.py*)
              sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light
              sudo systemctl stop nginx || true
              export SUDARSHAN_NGINX_REQUIRED=1 ;;
          esac
          if [ -n "$files" ]; then
            uv run pytest -q $files
          else
            echo "no sudarshan tests in this shard"
          fi

  # The upstream gthread-migration job's command, so every dispatched run checks the gthread
  # suite on GitHub's machines instead of each builder running it on a small box.
  gthread:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv pip install "gunicorn>=25.0,<26" "eventlet==0.41.2"
      - name: Run every gthread migration test file
        run: .venv/bin/python -m pytest test/test_gthread_*.py -o addopts="" --timeout=120 -rs
