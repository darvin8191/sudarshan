# सुदर्शन / SUDARSHAN checks for the `sudarshan` branch.
# Upstream's ci.yml runs only for `main` (which this fork never pushes to), so the two never overlap.
# Only our own code is gated here, plus upstream's tests for the upstream code SUDARSHAN changes on
# the order paths and upstream's eventlet tests (the upstream-orders job). The rest of upstream's
# test suite is upstream's business.
name: SUDARSHAN CI

on:
  pull_request:
    branches: ["sudarshan"]
  push:
    branches: ["sudarshan"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sudarshan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run

  # The phone and tablet screens in a real browser (gap audit GA12.1): every frontend/e2e/sd-*.spec.ts
  # in headless Chromium, against the production build, at the sizes each spec sets (360 x 800,
  # 800 x 360 on its side, the tablet sizes). Each spec answers its own requests and plays the
  # market-data socket, and the browser resolves no host name (frontend/playwright.sd.config.ts),
  # so nothing reaches a backend. Chromium is the build of the Playwright version
  # package-lock.json holds. The cost runs skip here: they belong to a quiet machine.
  # frontend/README.md, "The phone specs", says how to run the same thing on your own machine.
  phone-specs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Chromium for the installed Playwright (headless only)
        run: npx playwright install --with-deps --only-shell chromium
      # The bundle only: the frontend job checks the types.
      - run: npx vite build
      - name: The phone specs (e2e/sd-*.spec.ts)
        run: npx playwright test -c playwright.sd.config.ts
        env:
          SD_PREVIEW: "1"
      - name: Keep the report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: phone-specs-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The service tests in four shards side by side (sudarshan/tests/ci_shards.py splits them by file):
  # one job had grown past 20 minutes once watchlists v2 was in.
  backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      # The production server packages, which pyproject does not install: without them the
      # eventlet and gunicorn tests in sudarshan/ skip instead of running. Same pins as the
      # upstream gthread-migration job; `uv run` below keeps them (its sync is not exact).
      - name: Production server packages (gunicorn, eventlet)
        run: uv pip install "gunicorn>=25.0,<26" "eventlet==0.41.2"
      - name: Ruff (sudarshan/ only)
        run: |
          if find sudarshan -name '*.py' 2>/dev/null | grep -q .; then
            uv run ruff check sudarshan
          else
            echo "no Python code in sudarshan/ yet"
          fi
      - name: Tests (sudarshan/ only, one shard of four)
        run: |
          files=$(uv run python -m sudarshan.tests.ci_shards ${{ matrix.shard }} 4)
          # v0.12.0 review L3: the family view's nginx files are also run in a real nginx, and
          # without a binary those tests skip. The shard that holds them installs one (the
          # package's own service is stopped: the tests start their own on ports of their own).
          case " $files " in
            *test_nginx_text.py*)
              sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light
              sudo systemctl stop nginx || true
              export SUDARSHAN_NGINX_REQUIRED=1 ;;
          esac
          if [ -n "$files" ]; then
            uv run pytest -q $files
          else
            echo "no sudarshan tests in this shard"
          fi

  # The upstream gthread-migration job's command, so every dispatched run checks the gthread
  # suite on GitHub's machines instead of each builder running it on a small box.
  gthread:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv pip install "gunicorn>=25.0,<26" "eventlet==0.41.2"
      - name: Run every gthread migration test file
        run: .venv/bin/python -m pytest test/test_gthread_*.py -o addopts="" --timeout=120 -rs

  # Upstream's own tests for the upstream code SUDARSHAN changes on the order paths (the strategy
  # module, the scalping terminal, the Upstox order API), and upstream's eventlet tests, which run
  # eventlet in a subprocess and assert on elapsed time and hub liveness. Upstream's ci.yml runs
  # only on main, so without this job these files ran on a builder's box and nowhere else (v0.15.0
  # server review T1). The last step fails if an eventlet test skipped, as upstream's does.
  upstream-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: uv pip install "gunicorn>=25.0,<26" "eventlet==0.41.2"
      - name: The strategy module, scalping and Upstox order tests
        run: |
          .venv/bin/python -m pytest test/test_strategy_module_*.py test/test_migrate_strategy_module.py \
            test/test_scalping_*.py test/test_upstox_*.py -o addopts="" --timeout=300 -q -rs
      - name: The eventlet tests
        run: |
          .venv/bin/python -m pytest \
            test/test_eventlet_cross_thread_locks.py \
            test/test_sqlite_lock_cooperative.py \
            test/test_agent_stream_eventlet.py \
            test/test_telegram_startup.py \
            test/test_telegram_startup_isolation.py \
            test/test_gthread_deploy_eventlet.py \
            -o addopts="" --timeout=120 -rs --junitxml=eventlet.xml
      - name: Every eventlet test ran
        run: |
          .venv/bin/python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("eventlet.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{tests} eventlet tests, {skipped} skipped")
          sys.exit(1 if tests == 0 or skipped else 0)
          PY
