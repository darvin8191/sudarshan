# सुदर्शन / SUDARSHAN release build.
# The owner publishes a release vA.B.C on the `sudarshan` branch (GitHub website, one tap on a
# pre-filled link; Claude sessions cannot create releases or tags) -> this workflow builds
# frontend/dist on an ARM64 runner, attaches `frontend-dist.tar.gz` + `frontend-dist.tar.gz.sha256`
# and marks the release as the latest. The server's sudarshan-deploy.timer installs the latest
# release outside market hours. If the build fails, the release is turned into a pre-release so
# the server keeps the previous one. Manual runs (workflow_dispatch) build and test only.
name: SUDARSHAN release build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sudarshan-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release must be a vA.B.C tag on the sudarshan branch
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release tag '${TAG}' is not vA.B.C"; exit 1; }
          git merge-base --is-ancestor HEAD origin/sudarshan || { echo "${TAG} is not on the sudarshan branch"; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test frontend
        working-directory: frontend
        env:
          # Shown on the About page (M1.16; src/sudarshan/buildInfo.ts checks each
          # value's shape). The release tag is empty on manual runs.
          VITE_SD_RELEASE: ${{ github.event.release.tag_name }}
          VITE_SD_COMMIT: ${{ github.sha }}
          VITE_SD_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:run
          test -f dist/index.html

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: SUDARSHAN service tests
        run: |
          uv sync --dev
          if find sudarshan -path '*/tests/*' -name 'test_*.py' 2>/dev/null | grep -q .; then
            uv run pytest -q sudarshan
          else
            echo "no sudarshan tests yet"
          fi

      - name: Package dist
        run: |
          tar -czf frontend-dist.tar.gz -C frontend dist
          sha256sum frontend-dist.tar.gz | tee frontend-dist.tar.gz.sha256

      - name: Keep the build (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: |
            frontend-dist.tar.gz
            frontend-dist.tar.gz.sha256
          retention-days: 7

      - name: Attach to the release and make it the latest
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${TAG}" frontend-dist.tar.gz frontend-dist.tar.gz.sha256 --clobber
          gh release edit "${TAG}" --prerelease=false --latest

      - name: Failed build - demote the release so the server ignores it
        if: failure() && github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "${TAG}" --prerelease --latest=false || true
